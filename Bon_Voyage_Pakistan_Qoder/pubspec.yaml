name: bon_voyage_pakistan
description: "Bon Voyage Pakistan - Discover Pakistan, Beyond the Map"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  record: ^7.1.1
  audioplayers: ^6.1.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/login_bg.png
    - assets/images/signup_bg.png
